<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple space-inspired stopwatch. Start, stop, and reset time with ease."
    />
    <title>Orbit — Stopwatch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="stopwatch">
      <div class="topline">
        <a class="brand" href="#" aria-label="Orbit stopwatch home">
          <span class="brand-mark" aria-hidden="true">✳</span>
          <span>orbit</span>
        </a>
        <span class="live-indicator"><span></span> TIME IS RELATIVE</span>
      </div>

      <section class="timer-card" aria-labelledby="page-title">
        <p class="eyebrow">A LITTLE SPACE TO FOCUS</p>
        <h1 id="page-title">Your time,<br />in orbit.</h1>
        <p class="intro">Find your rhythm. We’ll keep track.</p>

        <div class="display" role="timer" aria-label="Elapsed time">
          <span id="minutes">00</span><span class="separator">:</span><span id="seconds">00</span><span class="decimal">.</span><span id="centiseconds" class="centiseconds">00</span>
        </div>
        <div class="time-labels" aria-hidden="true">
          <span>MINUTES</span><span>SECONDS</span><span>HUNDREDTHS</span>
        </div>

        <div class="controls" aria-label="Stopwatch controls">
          <button class="button button-start" id="start" type="button">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6.5 4.8a.8.8 0 0 1 1.2-.7l8 5.2a.8.8 0 0 1 0 1.4l-8 5.2a.8.8 0 0 1-1.2-.7V4.8Z" fill="currentColor" /></svg>
            Start
          </button>
          <button class="button button-stop" id="stop" type="button" disabled>
            <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1.5" fill="currentColor" /></svg>
            Stop
          </button>
          <button class="button button-reset" id="reset" type="button" aria-label="Reset stopwatch">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.2 9.1a6 6 0 1 1 .5 3.8M4 4.8v4.6h4.6" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" /></svg>
            Reset
          </button>
        </div>
        <p class="status" id="status" aria-live="polite">Ready when you are</p>
      </section>

      <footer class="footer">
        <span>TAKE YOUR TIME</span>
        <a href="https://www.pinterest.com/search/pins/?q=earth%20from%20space%20wallpaper" target="_blank" rel="noreferrer">EXPLORE EARTH ON PINTEREST <span aria-hidden="true">↗</span></a>
      </footer>
    </main>
  </body>
</html>
